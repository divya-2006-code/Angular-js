<!DOCTYPE html>
<html ng-app="app1">
<head>
  <title>Employee Management System</title>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to right, pink, deeppink, hotpink, fuchsia, lavenderblush, plum);

      padding: 20px;
    }
    .card {
      padding: 15px;
      margin: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
     
	  border: 4px dotted blue;
    }
    .highlight {
      border: 2px solid darkgreen;
      background-color: #d8f3dc;
    }
  </style>
</head>
<body ng-controller="c1">  
  <employee-card name="Anu" department="HR" email="anu2006@gmail.com" role="Manager" highlight></employee-card>
  <employee-card name="Hema" department="Finance" email="hema2007@gmail.com" role="Staff" ></employee-card>
  <employee-card name="Charu" department="IT" email="charu254@gmail.com" role="manager" highlight></employee-card>

  <script>
    var app = angular.module("app1", []);

    app.controller("c1", function($scope) {
     
    });

    app.directive("employeeCard", function() {
      return {
        restrict: 'E',
        scope: {
          name: '@',
          department: '@',
          email: '@',
          role: '@'
        },
        template: `
          <div class="card">
            <h4>{{name}}</h4>
            <p><strong>Department:</strong> {{department}}</p>
            <p><strong>Email:</strong> {{email}}</p>
            <p><strong>Role:</strong> {{role}}</p>
          </div>
        `
      };
    });

    app.directive("highlight", function() {
    return {
        restrict: 'A', 
        link: function(scope, element, attrs) {
           
            element.on('mouseenter', function() {
                element.addClass('highlight'); 
            });

            
            element.on('mouseleave', function() {
                element.removeClass('highlight');
            });
        }
    };
});

  </script>
</body>
</html>
